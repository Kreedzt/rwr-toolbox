<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>RWR Toolbox</title>
        <base href="./" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            /* This skeleton paints before Angular boots, so it cannot read
               data-theme. It mirrors the app themes through prefers-color-scheme;
               keep these values in sync with the theme blocks in styles.css. */
            :root {
                --sk-bg: #f9f8f4;
                --sk-fg: #29261f;
                --sk-sub: #8a8578;
                --sk-r1: #486924;
                --sk-r1-soft: rgba(72, 105, 36, 0.35);
                --sk-r2: #d38e22;
                --sk-r2-soft: rgba(211, 142, 34, 0.35);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --sk-bg: #211f19;
                    --sk-fg: #e3e1db;
                    --sk-sub: #8f8b7e;
                    --sk-r1: #7ea750;
                    --sk-r1-soft: rgba(126, 167, 80, 0.35);
                    --sk-r2: #e4ad3c;
                    --sk-r2-soft: rgba(228, 173, 60, 0.35);
                }
            }

            .app-loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: var(--sk-bg);
                color: var(--sk-fg);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    'Helvetica Neue',
                    Arial,
                    'PingFang SC',
                    'Hiragino Sans GB',
                    'Microsoft YaHei',
                    'Noto Sans CJK SC',
                    sans-serif;
                z-index: 9999;
            }

            .app-loading-spinner {
                position: relative;
                width: 56px;
                height: 56px;
            }

            .app-loading-spinner::before,
            .app-loading-spinner::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 3px solid transparent;
            }

            .app-loading-spinner::before {
                border-top-color: var(--sk-r1);
                border-right-color: var(--sk-r1-soft);
                animation: app-loading-spin 0.9s linear infinite;
            }

            .app-loading-spinner::after {
                inset: 8px;
                border-bottom-color: var(--sk-r2);
                border-left-color: var(--sk-r2-soft);
                animation: app-loading-spin 1.2s linear infinite reverse;
            }

            @keyframes app-loading-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .app-loading-title {
                margin-top: 24px;
                font-size: 18px;
                font-weight: 700;
                letter-spacing: 0.08em;
                color: var(--sk-fg);
            }

            .app-loading-sub {
                margin-top: 8px;
                font-size: 12px;
                font-weight: 500;
                color: var(--sk-sub);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .app-loading-dots {
                display: inline-flex;
                gap: 4px;
            }

            .app-loading-dots span {
                width: 4px;
                height: 4px;
                background: var(--sk-sub);
                border-radius: 50%;
                animation: app-loading-bounce 1.4s infinite ease-in-out both;
            }

            .app-loading-dots span:nth-child(1) {
                animation-delay: -0.32s;
            }

            .app-loading-dots span:nth-child(2) {
                animation-delay: -0.16s;
            }

            @keyframes app-loading-bounce {
                0%,
                80%,
                100% {
                    transform: scale(0);
                }
                40% {
                    transform: scale(1);
                }
            }
        </style>
    </head>
    <body>
        <app-root>
            <div class="app-loading">
                <div class="app-loading-spinner"></div>
                <div class="app-loading-title">RWR TOOLBOX</div>
                <div class="app-loading-sub">
                    Loading
                    <span class="app-loading-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </div>
            </div>
        </app-root>
    </body>
</html>
